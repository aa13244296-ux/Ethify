services:
  relay:
    build: .
    container_name: ethify-relay
    restart: always
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - ETHIFY_PSK=${ETHIFY_PSK:-change_this_to_your_secure_psk}
      - ETHIFY_PORT=51820
      - ETHIFY_SUBNET=10.88.0.0/24
    volumes:
      - ./data:/etc/ethify
