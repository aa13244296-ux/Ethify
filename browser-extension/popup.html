<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ethify Download Catcher</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        color: #e3ebf4;
        background: #111824;
        font: 13px "Segoe UI", sans-serif;
      }
      h1 { margin: 0 0 8px; font-size: 15px; }
      p { color: #9aa8b8; line-height: 1.5; }
      label { display: flex; align-items: center; gap: 9px; margin: 14px 0; }
      input { accent-color: #20d68e; }
      .filter { display: grid; gap: 6px; margin-top: 12px; }
      .filter input { width: 100%; padding: 8px; border: 1px solid #334154; border-radius: 6px; color: #e3ebf4; background: #0c121c; font: inherit; }
      button { padding: 8px 11px; border: 0; border-radius: 6px; color: #08120e; background: #20d68e; font-weight: 700; cursor: pointer; }
      #status { min-height: 34px; margin-bottom: 0; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>Ethify Download Catcher</h1>
    <p>Ethify captures matching browser downloads and detected media streams. Cookies are sent only to the local Ethify service.</p>
    <label><input id="enabled" type="checkbox"> Catch supported downloads</label>
    <label class="filter">
      <span>File extensions</span>
      <input id="extensions" type="text" aria-label="Allowed file extensions">
    </label>
    <button id="save" type="button">Save filter</button>
    <p id="status" role="status">Hold Alt while starting a browser download to bypass Ethify. Unsupported downloads continue in the browser.</p>
    <script src="popup.js"></script>
  </body>
</html>
