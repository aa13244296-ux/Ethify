<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ethify Download Catcher</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        color: #e3ebf4;
        background: #111824;
        font: 13px "Segoe UI", sans-serif;
      }
      h1 { margin: 0 0 8px; font-size: 15px; }
      p { color: #9aa8b8; line-height: 1.5; }
      label { display: flex; align-items: center; gap: 9px; margin: 14px 0; }
      input { accent-color: #20d68e; }
      #status { min-height: 34px; margin-bottom: 0; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>Ethify Download Catcher</h1>
    <p>Supported direct HTTP(S) downloads are handed to Ethify when at least two active adapters can reach the file.</p>
    <label><input id="enabled" type="checkbox"> Catch supported downloads</label>
    <p id="status" role="status">Capture is on by default. Browser downloads continue if Ethify cannot take over.</p>
    <script src="popup.js"></script>
  </body>
</html>
