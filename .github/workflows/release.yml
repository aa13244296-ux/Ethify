name: 🚀 Build & Publish Release 📦

on:
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to rebuild after a failed release (no tag is created).
        required: true
        type: string

permissions:
  contents: read

jobs:
  detect:
    name: 🔎 Detect Release Intent
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🔍 Resolve centrally created release tag
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          SHOULD_RELEASE="false"
          VERSION=""
          TAG=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
          fi

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?)$ ]]; then
            CHECKED_OUT_TAG="$(git describe --tags --exact-match HEAD)"
            if [[ "$CHECKED_OUT_TAG" != "$TAG" ]]; then
              echo "::error::The selected ref is not the exact requested tag: $TAG"
              exit 1
            fi
            VERSION="${TAG#v}"
            SHOULD_RELEASE="true"
          elif [[ -n "$TAG" ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Central release event: tag=$TAG should_release=$SHOULD_RELEASE"

  build-and-release:
    name: 📦 Build Linux & macOS Releases
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🐹 Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: 🔨 Compile Release Binaries
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          mkdir -p dist

          # 1. Linux amd64 Client & Relay
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/ethify-client-linux-amd64 ./cmd/ethify-client
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/ethify-relay ./cmd/ethify-relay

          # 2. macOS arm64 (Apple Silicon) Client
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/ethify-client-darwin-arm64 ./cmd/ethify-client

          # 3. macOS amd64 (Intel) Client
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/ethify-client-darwin-amd64 ./cmd/ethify-client

      - name: 📦 Build Debian installer
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          sh scripts/package-linux-deb.sh dist/ethify-client-linux-amd64 "$VERSION" release-artifacts

      - name: 📦 Package Archives
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          mkdir -p release-artifacts

          # 🐧 Linux Client TAR.GZ
          mkdir -p pack-linux
          cp dist/ethify-client-linux-amd64 pack-linux/ethify-client
          chmod +x pack-linux/ethify-client
          cp scripts/start-linux.sh pack-linux/start.sh
          chmod +x pack-linux/start.sh
          cp scripts/ethify.desktop pack-linux/
          cp -r configs pack-linux/
          cp README.md LICENSE pack-linux/
          tar -czvf release-artifacts/ethify-${TAG}-linux-amd64.tar.gz -C pack-linux .

          # 🍎 macOS Client TAR.GZ (Apple Silicon)
          mkdir -p pack-darwin-arm64
          sh scripts/create-macos-app.sh dist/ethify-client-darwin-arm64 pack-darwin-arm64 "${TAG#v}"
          cp dist/ethify-client-darwin-arm64 pack-darwin-arm64/ethify-client
          chmod +x pack-darwin-arm64/ethify-client
          cp -r configs pack-darwin-arm64/
          cp README.md LICENSE pack-darwin-arm64/
          tar -czvf release-artifacts/ethify-${TAG}-darwin-arm64.tar.gz -C pack-darwin-arm64 .

          # 🍎 macOS Client TAR.GZ (Intel)
          mkdir -p pack-darwin-amd64
          sh scripts/create-macos-app.sh dist/ethify-client-darwin-amd64 pack-darwin-amd64 "${TAG#v}"
          cp dist/ethify-client-darwin-amd64 pack-darwin-amd64/ethify-client
          chmod +x pack-darwin-amd64/ethify-client
          cp -r configs pack-darwin-amd64/
          cp README.md LICENSE pack-darwin-amd64/
          tar -czvf release-artifacts/ethify-${TAG}-darwin-amd64.tar.gz -C pack-darwin-amd64 .

          # ☁️ Linux Relay Server TAR.GZ
          mkdir -p pack-relay
          cp dist/ethify-relay pack-relay/
          cp scripts/install-relay.sh pack-relay/
          cp docker-compose.yml Dockerfile pack-relay/
          cp README.md LICENSE pack-relay/
          tar -czvf release-artifacts/ethify-relay-${TAG}-linux-amd64.tar.gz -C pack-relay .

      - name: Upload Linux and macOS release assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets-linux-macos
          path: release-artifacts/*
          if-no-files-found: error

  build-windows-installer:
    name: 🪟 Build Windows Setup Installer
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.tag }}
          persist-credentials: false

      - name: 🐹 Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: 🔨 Install Windows resources and build app
        shell: pwsh
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          & "$env:USERPROFILE\go\bin\rsrc.exe" -arch amd64 -ico assets\icon.ico -manifest assets\Ethifi.manifest -o cmd\ethify-client\resource.syso
          if ($LASTEXITCODE -ne 0) { throw "Windows resource compilation failed." }

          $stage = "dist\win-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath "-ldflags=-s -w -H=windowsgui -X main.version=$env:VERSION" -o "$stage\Ethify.exe" ./cmd/ethify-client
          if ($LASTEXITCODE -ne 0) { throw "Ethify Windows build failed." }
          Copy-Item README.md, LICENSE, assets\icon.ico -Destination $stage
          Copy-Item configs -Destination $stage -Recurse
          Copy-Item browser-extension -Destination $stage -Recurse
          if (Test-Path bin\amd64\wintun.dll) { Copy-Item bin\amd64\wintun.dll -Destination $stage }
          Remove-Item Env:\GOOS, Env:\GOARCH, Env:\CGO_ENABLED -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist\installers | Out-Null
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\installers\Ethify-$env:VERSION-windows-x64.zip" -Force

      - name: 📦 Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: 🪟 Create Windows setup executable
        shell: pwsh
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DAppVersion=$env:VERSION" "/DStageDir=..\dist\win-stage" installer\Ethify.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup packaging failed." }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets-windows
          path: dist\installers\*
          if-no-files-found: error

  publish:
    needs: [detect, build-and-release, build-windows-installer]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7.0.2
        with:
          pattern: release-assets-*
          path: dist/release
          merge-multiple: true

      - name: Generate checksums and publish to this repository
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          cd dist/release
          sha256sum * > checksums.txt
          cd ../..
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" \
              --title "Ethify $TAG" --generate-notes --verify-tag
          fi
