name: 🧪 CI & Quality Checks ⚙️

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Ethify Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Run tests
        run: go test -v -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Lint
        run: |
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m

  matrix-compile:
    name: 🔨 Cross-Compile Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            target: bin/ethify-client.exe
          - os: linux
            arch: amd64
            target: bin/ethify-client-linux-amd64
          - os: darwin
            arch: arm64
            target: bin/ethify-client-darwin-arm64
          - os: darwin
            arch: amd64
            target: bin/ethify-client-darwin-amd64
          - os: linux
            arch: amd64
            target: bin/ethify-relay
            cmd: ./cmd/ethify-relay
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🐹 Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: 🛠️ Build ${{ matrix.os }}/${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          CMD_PATH=${{ matrix.cmd || './cmd/ethify-client' }}
          go build -ldflags="-s -w" -o ${{ matrix.target }} "$CMD_PATH"
